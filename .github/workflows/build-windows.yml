name: Build Windows Installer

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - '.github/workflows/build-windows.yml'

permissions:
  contents: read

concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    name: Build StarAI Windows x64 (.exe)
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Run Windows computer-use unit tests
        run: cargo test -p host-core --locked computer

      - name: Prepare package inputs
        run: |
          set -euo pipefail
          cargo build --release --locked -p host-core &
          host_build_pid=$!
          trap 'kill "$host_build_pid" 2>/dev/null || true' EXIT

          pnpm install --frozen-lockfile
          pnpm --filter '@pi-desktop/desktop^...' --fail-if-no-match build

          wait "$host_build_pid"
          trap - EXIT

      - name: Package Windows installers (NSIS / Portable / ZIP)
        run: pnpm --filter @pi-desktop/desktop run dist:win -- --x64

      - name: List Windows release artifacts
        run: ls -lh apps/desktop/release/

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v7
        with:
          name: starai-windows-x64
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
          path: |
            apps/desktop/release/*.exe
            apps/desktop/release/*.zip
            apps/desktop/release/*.blockmap
            apps/desktop/release/latest.yml
